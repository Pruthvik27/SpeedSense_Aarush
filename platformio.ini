; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericCH32V203C6T6]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = genericCH32V203C6T6
framework = ch32v003fun
monitor_speed = 9600
upload_protocol = minichlink
build_flags = 
    -DFUNCONF_USE_HSE=1
    -DFUNCONF_SYSTEM_CORE_CLOCK=72000000
    ; -DFUNCONF_USE_DEBUG_UART=1
;build_type = debug
;debug_tool = custom
;debug_port = localhost:3333

;upload_protocol = custom
;upload_command = wchisp flash $SOURCE

; board_build.ldscript = ch32v203_custom.ld